# ============================================================================
# DID Hack — конфигурация LLM-планировщика (did_llm).
#
# Секрет сюда НЕ кладётся: ключ берётся из переменной окружения
# DID_LLM_API_KEY (или из llm_api_key в файле .env в рабочем каталоге).
#
# Формат плана и топики описаны в docs/INTERFACES.md бэкенда; здесь только то,
# что влияет на поведение планировщика.
# ============================================================================

llm_planner:
  ros__parameters:
    # --- подключение ---
    base_url: "https://api-ai.mai.ru/v1"
    model: "DeepSeek-V4-Flash"
    # Модель рассуждающая: без этого параметра она тратит 2-8 тысяч символов
    # на размышление и отвечает 35-42 с. С 'none' — меньше секунды.
    # Замерено на уникальных промптах, чтобы кэш эндпойнта не мешал.
    reasoning_effort: "none"

    # --- надёжность ---
    # Модель рассуждающая: на ответ в ~470 символов уходит около 2400 токенов
    # рассуждения, поэтому холодный запрос идёт 20-52 с. Прежний таймаут 20 с
    # обрывал половину запросов, а это выглядело как «модель недоступна».
    # max_tokens не ставим: при лимите токены целиком уходят в рассуждение и
    # content приходит пустым.
    timeout_sec: 180.0
    max_retries: 1

    # --- бюджет вызовов ---
    # Эндпойнт кэширует ответы по промпту, поэтому повторная сборка плана
    # из кэша бесплатна. Лимит держим на случай промаха.
    # Наблюдаемая задержка ответа 3-25 с, поэтому 12/мин недостижимо и
    # приводило к обрыву планирования на середине эпизода.
    min_interval_sec: 4.0
    max_calls_per_minute: 20
    max_calls_total: 400

    # --- поведение планировщика ---
    mission: "Собрать образцы, избегать дорогих зон, вернуться на базу до разрядки"
    # Их рекомендация из HANDOFF: 3-6 подцелей, чтобы успевать реагировать на
    # смену среды. Больше — батарея тратится вслепую.
    min_subgoals: 3
    max_subgoals: 6
    # Планируем не чаще: холодный запрос к модели идёт 20-52 с, поэтому за
    # эпизод реально получается 5-8 планов. Между ними агент доезжает сам.
    replan_period_sec: 30.0
    tick_period_sec: 1.0
    # Один повтор с возвратом причины отказа в промпт. Их handbook прямо
    # просит отдавать модели текст отказа.
    repair_attempts: 1
    # true: при недоступной модели эпизод доигрывает автономный режим.
    # false: ждать модель, ничего не отдавая. Для прогона, которым измеряют
    # именно планировщик, молчаливая передача делает результат бессмысленным.
    autonomous_fallback: true

    # --- журнал обменов ---
    exchanges_path: "logs/did_session.jsonl"