# ============================================================================
# DID Hack — конфигурация LLM-планировщика (did_llm).
#
# Секрет сюда НЕ кладётся: ключ берётся из переменной окружения
# DID_LLM_API_KEY (или из llm_api_key в файле .env в рабочем каталоге).
#
# Формат плана и топики описаны в docs/math-planner-prototype.md; здесь только то,
# что влияет на поведение планировщика.
# ============================================================================

llm_planner:
  ros__parameters:
    # Backend computes candidates and energy; the model returns only goal_id.
    # Old free-form planner remains available only for offline comparisons.
    planner_mode: "math_goals"
    # --- подключение ---
    base_url: "https://api-ai.mai.ru/v1"
    model: "deepseek-v4.1-flash"
    # Модель рассуждающая: без этого параметра она тратит 2-8 тысяч символов
    # на размышление и отвечает 35-42 с. С 'none' — меньше секунды.
    # Замерено на уникальных промптах, чтобы кэш эндпойнта не мешал.
    reasoning_effort: "none"

    # --- надёжность ---
    # A short ID-only decision runs outside ROS callbacks. After a timeout the
    # planner uses an explicitly labelled, backend-validated fallback choice.
    timeout_sec: 30.0
    max_retries: 0

    # --- бюджет вызовов ---
    # Budget applies to all real calls, including an optional repair.
    min_interval_sec: 4.0
    max_calls_per_minute: 20
    max_calls_total: 400

    # --- поведение планировщика ---
    # One ID decision per complete backend plan; at most one schema repair.
    tick_period_sec: 1.0

    # --- журнал обменов ---
    exchanges_path: "logs/did_session.jsonl"
