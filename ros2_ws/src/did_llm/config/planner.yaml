# ============================================================================
# DID Hack — конфигурация LLM-планировщика (did_llm).
#
# Секрет сюда НЕ кладётся: ключ берётся из переменной окружения
# DID_LLM_API_KEY (или из llm_api_key в файле .env в рабочем каталоге).
#
# Формат плана и топики описаны в docs/INTERFACES.md бэкенда; здесь только то,
# что влияет на поведение планировщика.
# ============================================================================

llm_planner:
  ros__parameters:
    # --- подключение ---
    base_url: "https://api-ai.mai.ru/v1"
    model: "DeepSeek-V4-Flash"

    # --- надёжность ---
    # Наблюдаемая задержка без кэша: 3-6 с типично, до 35 с в худшем случае.
    # Один повтор: повторять дольше бессмысленно, лучше отдать эпизод агенту.
    max_retries: 1

    # --- бюджет вызовов ---
    # Эндпойнт кэширует ответы по промпту, поэтому повторная сборка плана
    # из кэша бесплатна. Лимит держим на случай промаха.
    min_interval_sec: 4.0
    max_calls_per_minute: 12
    max_calls_total: 400

    # --- поведение планировщика ---
    mission: "Собрать образцы, избегать дорогих зон, вернуться на базу до разрядки"
    # Их рекомендация из HANDOFF: 3-6 подцелей, чтобы успевать реагировать на
    # смену среды. Больше — батарея тратится вслепую.
    min_subgoals: 3
    max_subgoals: 6
    # Планируем не чаще: между планами агент доезжает и ищет сам.
    replan_period_sec: 12.0
    tick_period_sec: 1.0
    # Один повтор с возвратом причины отказа в промпт. Их handbook прямо
    # просит отдавать модели текст отказа.
    repair_attempts: 1

    # --- журнал обменов ---
    exchanges_path: "logs/did_session.jsonl"