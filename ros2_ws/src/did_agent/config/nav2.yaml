# Nav2 consumes only the same map/observations as the custom navigator.
# Topic/frame contracts are deliberately isolated from Gazebo's wheel-odom TF.
nav2:
  bt_navigator:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: nav2_base_link
      odom_topic: /nav2/odom
      transform_tolerance: 0.3
      bt_loop_duration: 20
      # Action acknowledgements use wall time. Docker/Gazebo can briefly
      # contend for CPU; 50 ms aborted otherwise healthy paths under load.
      # This does not relax the agent's scan/pose/velocity freshness checks.
      default_server_timeout: 1000
      wait_for_service_timeout: 3000
      navigators: [navigate_to_pose]
      navigate_to_pose:
        plugin: nav2_bt_navigator::NavigateToPoseNavigator
      # Stock tree replans at 1 Hz and performs bounded, collision-checked
      # recovery (clear, spin, wait, back up). All motion passes the agent gate.
      error_code_names: [compute_path_error_code, follow_path_error_code]

  planner_server:
    ros__parameters:
      use_sim_time: true
      expected_planner_frequency: 1.0
      planner_plugins: [GridBased]
      GridBased:
        plugin: nav2_navfn_planner::NavfnPlanner
        tolerance: 0.05
        use_astar: true
        allow_unknown: false
        use_final_approach_orientation: true

  controller_server:
    ros__parameters:
      use_sim_time: true
      enable_stamped_cmd_vel: true
      controller_frequency: 10.0
      costmap_update_timeout: 1.0
      odom_topic: /nav2/odom
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.001
      min_theta_velocity_threshold: 0.001
      failure_tolerance: 0.3
      progress_checker_plugins: [progress_checker]
      goal_checker_plugins: [position_goal_checker]
      controller_plugins: [FollowPath]
      progress_checker:
        plugin: nav2_controller::SimpleProgressChecker
        required_movement_radius: 0.05
        movement_time_allowance: 12.0
      position_goal_checker:
        # This works on all Jazzy releases, including those predating the
        # dedicated PositionGoalChecker. Agent goals do not specify a yaw.
        plugin: nav2_controller::SimpleGoalChecker
        xy_goal_tolerance: 0.08
        yaw_goal_tolerance: 3.15
        stateful: false
      FollowPath:
        plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
        desired_linear_vel: 0.18
        lookahead_dist: 0.25
        min_lookahead_dist: 0.20
        max_lookahead_dist: 0.40
        lookahead_time: 1.5
        use_velocity_scaled_lookahead_dist: false
        rotate_to_heading_angular_vel: 1.0
        rotate_to_heading_min_angle: 0.5
        max_angular_accel: 2.0
        transform_tolerance: 0.3
        use_rotate_to_heading: true
        allow_reversing: false
        min_approach_linear_velocity: 0.04
        approach_velocity_scaling_dist: 0.4
        use_collision_detection: true
        max_allowed_time_to_collision_up_to_carrot: 1.5
        use_regulated_linear_velocity_scaling: true
        regulated_linear_scaling_min_radius: 0.4
        regulated_linear_scaling_min_speed: 0.05
        # Intermediate static costs also encode observed terrain prices. They
        # cannot be inverted into distance-to-wall by the controller.
        use_cost_regulated_linear_velocity_scaling: false

  local_costmap:
    local_costmap:
      ros__parameters:
        use_sim_time: true
        global_frame: odom
        robot_base_frame: nav2_base_link
        transform_tolerance: 0.3
        update_frequency: 10.0
        publish_frequency: 2.0
        rolling_window: true
        width: 3
        height: 3
        resolution: 0.05
        robot_radius: 0.20
        footprint_padding: 0.0
        track_unknown_space: true
        trinary_costmap: false
        lethal_cost_threshold: 100
        plugins: [static_layer, obstacle_layer, inflation_layer]
        static_layer:
          plugin: nav2_costmap_2d::StaticLayer
          map_topic: /nav2/knowledge_map
          map_subscribe_transient_local: true
        obstacle_layer:
          plugin: nav2_costmap_2d::ObstacleLayer
          observation_sources: scan
          combination_method: 1
          scan:
            topic: /nav2/scan
            data_type: LaserScan
            marking: true
            clearing: true
            inf_is_valid: true
            raytrace_min_range: 0.12
            raytrace_max_range: 3.5
            obstacle_min_range: 0.12
            obstacle_max_range: 3.5
            max_obstacle_height: 2.0
        inflation_layer:
          plugin: nav2_costmap_2d::InflationLayer
          inflation_radius: 0.45
          cost_scaling_factor: 6.0
        always_send_full_costmap: true

  global_costmap:
    global_costmap:
      ros__parameters:
        use_sim_time: true
        global_frame: odom
        robot_base_frame: nav2_base_link
        transform_tolerance: 0.3
        update_frequency: 2.0
        publish_frequency: 1.0
        robot_radius: 0.20
        footprint_padding: 0.0
        resolution: 0.05
        track_unknown_space: true
        # Preserve the agent's observed terrain prices as traversable costs.
        trinary_costmap: false
        lethal_cost_threshold: 100
        plugins: [static_layer, obstacle_layer, inflation_layer]
        static_layer:
          plugin: nav2_costmap_2d::StaticLayer
          map_topic: /nav2/knowledge_map
          map_subscribe_transient_local: true
        obstacle_layer:
          plugin: nav2_costmap_2d::ObstacleLayer
          observation_sources: scan
          combination_method: 1
          scan:
            topic: /nav2/scan
            data_type: LaserScan
            marking: true
            clearing: true
            inf_is_valid: true
            raytrace_min_range: 0.12
            raytrace_max_range: 3.5
            obstacle_min_range: 0.12
            obstacle_max_range: 3.5
            max_obstacle_height: 2.0
        inflation_layer:
          plugin: nav2_costmap_2d::InflationLayer
          inflation_radius: 0.45
          cost_scaling_factor: 6.0
        always_send_full_costmap: true

  behavior_server:
    ros__parameters:
      use_sim_time: true
      enable_stamped_cmd_vel: true
      local_costmap_topic: local_costmap/costmap_raw
      global_costmap_topic: global_costmap/costmap_raw
      local_footprint_topic: local_costmap/published_footprint
      global_footprint_topic: global_costmap/published_footprint
      cycle_frequency: 10.0
      behavior_plugins: [spin, backup, wait]
      spin:
        plugin: nav2_behaviors::Spin
      backup:
        plugin: nav2_behaviors::BackUp
      wait:
        plugin: nav2_behaviors::Wait
      local_frame: odom
      global_frame: odom
      robot_base_frame: nav2_base_link
      transform_tolerance: 0.3
      simulate_ahead_time: 2.0
      max_rotational_vel: 1.0
      min_rotational_vel: 0.2
      rotational_acc_lim: 2.0
