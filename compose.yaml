services:
  sim:
    build:
      context: .
    image: did/robot-researcher:jazzy
    init: true
    stdin_open: true
    tty: true
    environment:
      LIBGL_ALWAYS_SOFTWARE: "1"
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-30}"
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      TURTLEBOT3_MODEL: burger
    ports:
      - "127.0.0.1:8080:8080"
    command:
      - ros2
      - launch
      - did_agent
      - demo.launch.py
      - scenario:=${SCENARIO:-easy}
      - scenario_file:=${SCENARIO_FILE:-none}
    volumes:
      - gz-cache:/root/.gz
      - ./scenarios_custom:/scenarios_custom
    stop_grace_period: 15s

volumes:
  gz-cache:

